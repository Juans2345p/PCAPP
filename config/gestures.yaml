# Suavizado de posición de muñeca y banda neutral de control.
calibration:
  curl_lo: 0.3  # heredado; no se usa en el control por muñeca
  curl_hi: 0.97  # heredado; no se usa en el control por muñeca
  smoothing: 0.35  # alfa del filtro EMA (más alto = más reactivo)
  deadzone: 0.25  # media anchura normalizada de la banda STOP

# Con una sola mano visible:
#   own  -> mueve únicamente su rueda
#   both -> copia la velocidad a las dos ruedas
control_mode: "own"
